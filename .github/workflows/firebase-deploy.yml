name: Deploy Firebase Rules

on:
  push:
    branches:
      - main
    paths:
      - "firestore.rules"
      - ".github/workflows/firebase-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Firestore Rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # secrets can't be used directly in `if:`, so surface presence as a boolean.
    # the value itself stays out of the job env: only the deploy step below needs
    # it, and a job-level env hands it to every step including third-party ones.
    env:
      HAS_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      # firebase login:ci tokens are deprecated and google is revoking them;
      # this skips cleanly (green) until FIREBASE_SERVICE_ACCOUNT is set, then
      # deploys via the supported service-account path. to enable: create a
      # service account with the firebase rules admin role, download its json
      # key, and add it as the FIREBASE_SERVICE_ACCOUNT repo secret.
      - name: Skip notice (no service account configured)
        if: env.HAS_SERVICE_ACCOUNT != 'true'
        run: echo "::notice::FIREBASE_SERVICE_ACCOUNT not set - skipping firestore rules deploy. add the secret to enable."

      - name: Checkout repository
        if: env.HAS_SERVICE_ACCOUNT == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pinned to a release sha; authenticates via GCP_SA_KEY (service
      # account json), the non-deprecated method.
      - name: Deploy to Firebase
        if: env.HAS_SERVICE_ACCOUNT == 'true'
        uses: w9jds/firebase-action@fc894b2de04cfc04c398e98dea8ac546470fbd6b # v15.34.0
        with:
          args: deploy --only firestore:rules
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT_ID: netdash-toolkit
