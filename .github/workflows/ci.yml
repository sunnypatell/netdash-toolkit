# ci: quality gates + web build + electron packaging smoke test.
#
# design notes:
# - one consolidated quality job instead of 3 separate jobs (format/lint/
#   typecheck used to each pay a full checkout+install; same coverage, third
#   of the wall clock).
# - electron packaging (--dir) runs on every push/PR; previously electron
#   packaging was only ever exercised at release time, which is the worst
#   possible moment to find out it broke.
# - quality and build run in parallel, not chained. actions minutes are free
#   on a public repo, so gating build behind quality only bought a saved
#   runner on already-broken prs and cost every healthy pr the full quality
#   wall clock before the build even started.
# - caching: pnpm store (integrity-checked by the lockfile), .next/cache,
#   the docs (astro) install, and the electron + electron-builder binary
#   caches. release builds in release.yml deliberately do NOT use these
#   caches (hermetic builds).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (format, lint, types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Check formatting
        run: pnpm format:check

      - name: Run ESLint
        run: pnpm lint

      - name: Typecheck (app)
        run: pnpm typecheck

      - name: Typecheck (electron main/preload)
        run: pnpm electron:compile

      # both vitest projects: unit (node) + components (happy-dom)
      - name: Run tests
        run: pnpm test

  build:
    name: Build (web + electron pack)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Restore Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('app/**', 'components/**', 'contexts/**', 'data/**', 'lib/**', 'types/**', 'next.config.mjs', 'postcss.config.mjs') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # docs/ is a separate pnpm project with its own lockfile, so `pnpm build`
      # installs it from the network on every run: setup-node's store cache is
      # keyed on the ROOT lockfile only and is written by whichever job finishes
      # first, so the astro deps never make it in. exact key only - a partially
      # restored node_modules is worse than a clean install.
      - name: Restore docs (astro) install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: docs/node_modules
          key: docs-deps-${{ runner.os }}-${{ hashFiles('docs/pnpm-lock.yaml') }}

      - name: Restore Electron binary caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Build web application
        run: pnpm build

      # same script a contributor runs locally (`pnpm electron:pack` packs for
      # the host platform); --linux is appended for the runner
      - name: Pack Electron app (smoke test)
        run: pnpm electron:pack --linux

      - name: Assert packaged app launchable artifacts exist
        run: |
          test -x "release/linux-unpacked/netdash-toolkit" || { echo "::error::packed electron binary missing"; exit 1; }
          test -f "release/linux-unpacked/resources/app.asar" || { echo "::error::app.asar missing from package"; exit 1; }
