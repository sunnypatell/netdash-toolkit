name: Setup Node + pnpm
description: >
  Single source of truth for toolchain setup: pnpm version comes from the
  packageManager field in package.json, node from .nvmrc. Installs with a
  frozen lockfile. Set cache to "false" for release builds that must stay
  hermetic (no restored state of any kind).

inputs:
  cache:
    description: Use the pnpm store cache ("true"/"false")
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: ${{ inputs.cache == 'true' && 'pnpm' || '' }}

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
