# pnpm 11+ reads settings from here only; this is a single project, not a workspace
# matches the 7-day cooldown dependabot.yml applies, so no install resolves anything younger
minimumReleaseAge: 10080

allowBuilds:
  electron: true
  "@tailwindcss/oxide": true
  electron-winstaller: true
  # postinstall-only setup neither package needs here; pnpm 10 skipped them the same way
  "@firebase/util": false
  protobufjs: false

overrides:
  flatted: "^3.4.2"
  "js-yaml@^4.0.0": "^4.3.2"
  "minimatch@^3.0.0": "^3.1.3"
  "glob@^10.0.0": "^10.5.0"
  "postcss@^8.0.0": "^8.5.24"
  "protobufjs@^7.0.0": "^7.6.5"
  "sharp@^0.34.0": "^0.35.4"
  "fast-uri@^3.0.0": "^3.1.9"
  "shell-quote@^1.0.0": "^1.11.0"
  brace-expansion: "^5.0.10"
  "@grpc/grpc-js@~1.9.0": "~1.13.6"
